name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Toolchain
      run: |
        sw_vers
        xcodebuild -version
        clang --version
        uname -m

    - name: Dependencies
      run: brew install boost capnp google-sparsehash libiconv multimarkdown ninja ragel

    # The scm tests exercise the Mercurial and Subversion drivers.
    - name: Test dependencies
      run: brew install mercurial subversion

    - name: Configure
      run: ./configure && cat local.rave

    # -k 0 keeps going after failures so one run reports every broken file.
    - name: Build
      run: |
        set -o pipefail
        ninja -k 0 Rouvre 2>&1 | tee build.log

    - name: Verify bundle
      run: |
        app="$HOME/build/rouvre/release/Applications/TextMate/Rouvre.app"
        codesign --verify --deep --strict "$app"
        lipo -archs "$app/Contents/MacOS/Rouvre"
        test -f "$app/Contents/Resources/Rouvre.icns"
        test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' "$app/Contents/Info.plist")" = Rouvre
        /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist"
        otool -l "$app/Contents/MacOS/Rouvre" | grep -A4 -E 'LC_BUILD_VERSION|LC_VERSION_MIN_MACOSX' | grep -E 'minos|version|sdk'
        # The binary and the Info.plist must declare the same minimum system.
        minos="$(otool -l "$app/Contents/MacOS/Rouvre" | awk '/LC_BUILD_VERSION/ { f = 1 } f && /minos/ { print $2; exit }')"
        declared="$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$app/Contents/Info.plist")"
        echo "minos=$minos LSMinimumSystemVersion=$declared"
        test "$minos" = "$declared"

    # The application must run on a machine without Homebrew: every Mach-O
    # file in the bundle may only load system libraries or bundled ones.
    - name: Verify library dependencies
      run: |
        app="$HOME/build/rouvre/release/Applications/TextMate/Rouvre.app"
        bad=0
        while IFS= read -r -d '' f; do
          file -b "$f" | grep -q 'Mach-O' || continue
          deps="$(otool -L "$f" | tail -n +2 | awk '{print $1}' | grep -vE '^(/usr/lib/|/System/Library/|@rpath/|@executable_path/|@loader_path/)' || true)"
          if [ -n "$deps" ]; then
            echo "::error::${f#$app/} loads non-system libraries:"
            echo "$deps"
            bad=1
          fi
        done < <(find "$app" -type f -print0)
        otool -L "$app/Contents/MacOS/Rouvre"
        # Text conversion must come from the bundled GNU libiconv, not from
        # the iconv of the system.
        if nm -u "$app/Contents/MacOS/Rouvre" | grep -E '_(lib)?iconv'; then
          echo "::error::Rouvre still imports iconv symbols from a shared library"
          bad=1
        fi
        nm "$app/Contents/MacOS/Rouvre" | grep ' [Tt] _libiconv_open$' > /dev/null || { echo "::error::GNU libiconv is not linked into Rouvre"; bad=1; }
        # No executable in the bundle may name a host of the upstream project.
        while IFS= read -r -d '' f; do
          file -b "$f" | grep -q 'Mach-O' || continue
          hosts="$(strings -a "$f" | grep -Eiow '[a-z0-9.-]*(macromates\.com|textmate\.org)' | sort -u || true)"
          if [ -n "$hosts" ]; then
            echo "::error::${f#$app/} names upstream hosts:"
            echo "$hosts"
            bad=1
          fi
        done < <(find "$app" -type f -print0)
        exit $bad

    # ditto keeps symlinks, permissions and the code signature intact.
    - name: Package application
      run: ditto -c -k --keepParent "$HOME/build/rouvre/release/Applications/TextMate/Rouvre.app" "$RUNNER_TEMP/Rouvre-arm64.zip"

    - name: Upload application
      uses: actions/upload-artifact@v4
      with:
        name: app-arm64
        path: ${{ runner.temp }}/Rouvre-arm64.zip
        retention-days: 14
        compression-level: 0

    # Unit tests of every target that declares a ‘tests’ directive. -k 0 runs
    # them all so one run reports every failing target.
    - name: Test
      run: |
        set -o pipefail
        ninja -k 0 tests 2>&1 | tee test.log

    - name: Test summary
      if: always()
      run: |
        test -f test.log || exit 0
        {
          echo '### Unit tests'
          echo
          echo "Failed edges: $(grep -c '^FAILED:' test.log || true)"
          echo
          echo '```'
          grep -A12 -E '^FAILED:|: (fatal )?error: |^Undefined symbols' test.log | grep -v '^ld: warning' | sed -E 's#/Users/runner/(work/rouvre/rouvre|build/rouvre)/##g' | cut -c1-300 | head -150
          echo '```'
        } | tee -a "$GITHUB_STEP_SUMMARY"

    - name: Upload test log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-log
        path: test.log
        if-no-files-found: ignore

    - name: Diagnostics summary
      if: always()
      run: |
        strip='s/^.*\/(Frameworks|Applications|PlugIns|vendor|Shared)\//\1\//'
        {
          echo '### Build diagnostics'
          echo
          echo "Failed edges: $(grep -c '^FAILED:' build.log || true)"
          echo "Errors: $(grep -cE ': (fatal )?error: ' build.log || true)"
          echo "Warnings: $(grep -c 'warning:' build.log || true)"
          echo
          echo '#### Errors'
          echo '```'
          grep -E ': (fatal )?error: ' build.log | sed -E "$strip" | sort | uniq -c | sort -rn | head -200
          echo '```'
          echo '#### Warnings by flag'
          echo '```'
          grep 'warning:' build.log | grep -oE '\[-W[^]]+\]' | sort | uniq -c | sort -rn | head -50
          echo '```'
        } | tee -a "$GITHUB_STEP_SUMMARY"

    - name: Upload build log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: build.log
