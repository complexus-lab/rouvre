name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Toolchain
      run: |
        sw_vers
        xcodebuild -version
        clang --version
        uname -m

    - name: Dependencies
      run: brew install boost capnp google-sparsehash multimarkdown ninja ragel

    - name: Configure
      run: ./configure && cat local.rave

    # -k 0 keeps going after failures so one run reports every broken file.
    - name: Build
      run: |
        set -o pipefail
        ninja -k 0 TextMate 2>&1 | tee build.log

    - name: Verify bundle
      run: |
        app="$HOME/build/rouvre/release/Applications/TextMate/TextMate.app"
        codesign --verify --deep --strict "$app"
        lipo -archs "$app/Contents/MacOS/TextMate"
        otool -l "$app/Contents/MacOS/TextMate" | grep -A4 -E 'LC_BUILD_VERSION|LC_VERSION_MIN_MACOSX' | grep -E 'minos|version|sdk'

    - name: Diagnostics summary
      if: always()
      run: |
        strip='s/^.*\/(Frameworks|Applications|PlugIns|vendor|Shared)\//\1\//'
        {
          echo '### Build diagnostics'
          echo
          echo "Failed edges: $(grep -c '^FAILED:' build.log || true)"
          echo "Errors: $(grep -cE '(error|fatal error):' build.log || true)"
          echo "Warnings: $(grep -c 'warning:' build.log || true)"
          echo
          echo '#### Errors'
          echo '```'
          grep -E '(error|fatal error):' build.log | sed -E "$strip" | sort | uniq -c | sort -rn | head -200
          echo '```'
          echo '#### Warnings by flag'
          echo '```'
          grep 'warning:' build.log | grep -oE '\[-W[^]]+\]' | sort | uniq -c | sort -rn | head -50
          echo '```'
        } | tee -a "$GITHUB_STEP_SUMMARY"

    - name: Upload build log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: build.log
